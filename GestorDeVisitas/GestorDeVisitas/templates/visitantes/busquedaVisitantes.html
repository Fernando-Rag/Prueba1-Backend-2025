{% extends 'visitantes/base.html' %}
{% block title %}Búsqueda de Visitantes{% endblock %}
{% block main %}
<div class="max-w-xl mx-auto mt-8 bg-white rounded-lg shadow-lg p-8">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Buscar Visitante</h2>
  <form method="get" class="mb-6">
    <input type="text" name="q" value="{{ query }}" placeholder="Buscar por nombre, apellido o RUT"
      class="w-full px-4 py-2 border border-gray-300 rounded-full mb-2 focus:outline-none focus:ring-2 focus:ring-yellow-400">
    <button type="submit" class="w-full bg-yellow-400 text-white py-2 rounded-full font-semibold text-lg hover:bg-yellow-500 transition">Buscar</button>
  </form>
  <ul>
    {% for v in visitantes %}
    <li class="py-2 border-b">
      {{ v.nombre_s }} {{ v.apellido_s }} ({{ v.rut }})
    </li>
    {% empty %}
    <li class="text-gray-400 py-4">No se encontraron visitantes.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
